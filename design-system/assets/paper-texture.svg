<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Souvenote paper grain (owner-approved 2026-11-05). Generated, no photo: fractal noise lit from the
       upper right so the fibres look slightly raised, then shifted to mid-grey so a soft-light blend adds
       grain without changing the average background colour. Tiles seamlessly at 320px. -->
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.72 0.5" numOctaves="4" seed="11" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="1.4">
      <feDistantLight azimuth="55" elevation="58"/>
    </feDiffuseLighting>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1" intercept="-0.35"/>
      <feFuncG type="linear" slope="1" intercept="-0.35"/>
      <feFuncB type="linear" slope="1" intercept="-0.35"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#p)"/>
</svg>
